# Alembic configuration.
#
# sqlalchemy.url is deliberately absent: the URL comes from DATABASE_URL via
# app.config in alembic/env.py, so migrations and the application can never disagree
# about which database they are pointed at, and no connection string lives in the repo.
[alembic]
script_location = alembic
prepend_sys_path = .
# Filenames sort chronologically, which makes `ls alembic/versions` a history.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
