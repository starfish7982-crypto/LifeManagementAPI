name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests alembic scripts

      - name: Test
        run: pytest --cov=app --cov-report=term-missing

      # The migrations have to work, not just exist. Applying them to an empty database
      # and then asking autogenerate for a diff proves two things at once: every
      # revision runs, and the models match the schema they produce. A model change
      # committed without its migration fails here rather than on deploy.
      - name: Migrations match the models
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          alembic upgrade head
          alembic check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # Three separate steps rather than one `npm run build`, so a failure names which
      # gate it was: a type error, a lint error, and a build error are different
      # problems with different fixes.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx vite build

  docker:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      # Builds both stages, so this also proves the two halves compose — the API image
      # is only useful if the frontend stage produced something for it to serve.
      - name: Build image
        run: docker build -t life-management-api:ci .
