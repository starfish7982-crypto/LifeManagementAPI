[project]
name = "life-management-api"
version = "0.1.0"
description = "REST API for personal asset tracking, reminders, and daily todos, with Telegram and Google Calendar integrations."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "icalendar>=5.0",
    "python-dateutil>=2.9",
    # Postgres driver for deployed environments. The binary wheel avoids needing
    # libpq headers at image build time. SQLite needs no driver, so local development
    # and the test suite never touch this.
    "psycopg[binary]>=3.1",
    # Auth. pwdlib is the maintained successor to passlib (which has not had a release
    # since 2020 and breaks against bcrypt 4.1+); `PasswordHash.recommended()` selects
    # Argon2id. PyJWT signs the access tokens. email-validator backs Pydantic's EmailStr.
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.8",
    "email-validator>=2.1",
    # Required to parse the form-encoded body of the OAuth2 password flow that
    # /auth/login implements. FastAPI raises at import time without it.
    "python-multipart>=0.0.9",
    # Schema migrations. create_all() cannot alter an existing table, which is exactly
    # what adding user_id to live tables requires.
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.4", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Declared explicitly. Setuptools' automatic flat-layout discovery fails as soon as
# there is another top-level directory (a .venv, for instance), which is exactly what
# happens on a fresh clone.
[tool.setuptools]
packages = ["app", "app.routers", "app.services"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Revision files are Alembic's output, not hand-written source. Linting them means
# reformatting a generated file after every `alembic revision --autogenerate`, and a
# migration that has already run against a database should not be edited for style.
# alembic/env.py is hand-written and is still checked.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags `Depends()` in argument defaults, which is how FastAPI dependency
# injection is written. Ignoring it is standard for FastAPI codebases.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
